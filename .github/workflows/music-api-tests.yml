name: Music API checks

on:
  push:
    branches:
      - feat/voicechat-music-api-v1
  pull_request:

jobs:
  music-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Music API test dependencies
        run: python -m pip install --upgrade aiohttp python-dotenv
      - name: Compile API modules
        run: python -m compileall -q music_api
      - name: Run Music API tests
        run: python -m unittest discover -s tests -v
